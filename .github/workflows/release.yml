# Gera o .exe para Windows e coloca na Release do GitHub.
# Roda sozinho quando uma tag "v..." é enviada (ex.: v1.0, v1.1)
# ou pelo botão "Run workflow" na aba Actions.
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o Godot e o modelo do Windows
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            'templates/windows_release_x86_64.exe' 'templates/windows_release_x86_64_console.exe' 'templates/version.txt' -d "$dest"
          rm -f ./*.tpz ./*.zip

      - name: Exportar o .exe
        run: |
          mkdir -p build/windows
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-release "Windows" build/windows/ViajePorElEspanol.exe
          ls -la build/windows
          test -s build/windows/ViajePorElEspanol.exe

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag=v1.0; fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Viaje por el Español ${tag#v}" --notes-file .github/release_notes.md
          gh release upload "$tag" build/windows/ViajePorElEspanol.exe --clobber
